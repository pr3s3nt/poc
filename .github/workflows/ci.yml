name: Product CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      REQUIRE_POSTGRES: '1'
      REQUIRE_TERRAFORM: '1'
      ORCHESTRATOR_POSTGRES_TEST_URL: postgres://postgres:ci-disposable-test@127.0.0.1:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration versions and immutable history
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$MIGRATION_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD^)
          fi
          python3 ../scripts/check_migrations.py --base "$base"
          python3 ../scripts/test_migrations.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install Redis for integration tests
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Test
        env:
          ORCHESTRATOR_POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: go test -timeout 30m -count=1 ./...

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Race-test critical packages
        run: go test -race ./internal/planning ./test/e2e ./test/conformance

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
