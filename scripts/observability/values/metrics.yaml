# Small-cluster starting point, not company production policy. Chart: 92.18.0.
# Component switches and storage class are supplied by setup.sh from config.
defaultRules:
  create: true
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 4GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: '2', memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 8Gi}
alertmanager:
  config:
    route: {receiver: discard, routes: []}
    receivers: [{name: discard}]
  alertmanagerSpec:
    retention: 72h
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 1Gi}
grafana:
  # Prefer admin.existingSecret in company values. Never put credentials in Git.
  persistence: {enabled: true, size: 1Gi}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  sidecar:
    dashboards:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
    datasources:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
# Required for local-query cluster isolation. Replace with kube-system UID.
kubelet:
  serviceMonitor:
    # Preserve the pinned chart kubelet bucket filter before adding local identity.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - {action: replace, targetLabel: cluster_uid, replacement: CHANGE_ME_CLUSTER_UID}
    # Preserve the pinned chart cAdvisor filters before adding local identity.
    cAdvisorMetricRelabelings:
    - sourceLabels:
      - __name__
      action: drop
      regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
    - sourceLabels:
      - __name__
      action: drop
      regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
    - sourceLabels:
      - __name__
      action: drop
      regex: container_memory_mapped_file
    - sourceLabels:
      - __name__
      action: drop
      regex: container_(file_descriptors|tasks_state|threads_max)
    - sourceLabels:
      - __name__
      - scope
      action: drop
      regex: container_memory_failures_total;hierarchy
    - sourceLabels:
      - __name__
      - interface
      action: drop
      regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
    - sourceLabels:
      - __name__
      action: drop
      regex: container_spec.*
    - sourceLabels:
      - id
      - pod
      action: drop
      regex: .+;
    - action: replace
      targetLabel: cluster_uid
      replacement: CHANGE_ME_CLUSTER_UID
kube-state-metrics:
  prometheus:
    monitor:
      metricRelabelings:
        - {action: replace, targetLabel: cluster_uid, replacement: CHANGE_ME_CLUSTER_UID}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 300m, memory: 256Mi}
prometheus-node-exporter:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
# Review these switches for the destination distribution; no routing changes.
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
