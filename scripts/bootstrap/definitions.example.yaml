# Copy outside Git and chmod 600. Git credentials remain in platform settings.
# For an exact internal mirror, change only repository.url.
# If the mirror has new commits, also set repository.ref to its full commit.
schemaVersion: 1
console:
  url: https://console.company.example
  username: platform-engineer
  passwordFile: ./credentials/password
  expectedOrganization: your-org
repository:
  url: https://github.com/pr3s3nt/orchestrator-workload-templates
  ref: 84f8d9f026d5ff0d44b8783f2fad743b3ca9c427
parameters:
  driverAccountKey: REPLACE_WITH_EXISTING_ACCOUNT_KEY
  definitionPrefix: platform
  definitionName: Platform
  environmentType: staging
  targetClass: default
  resourceClass: in-cluster
  endpointRootDomain: apps.company.example
  endpointScheme: https
  gatewayName: traefik-gateway
  gatewayNamespace: traefik
  gatewaySectionName: websecure
resourceTypes:
  - key: persistent-storage
    inputs:
      - name: storage
        type: string
        required: false
    outputs:
      - name: claimName
        type: string
        required: true
        secret: false
      - name: namespace
        type: string
        required: true
        secret: false
  - key: k8s-cluster
    inputs: []
    outputs:
      - name: name
        type: string
        required: true
        secret: false
      - name: endpoint
        type: string
        required: false
        secret: false
      - name: kubeContext
        type: string
        required: true
        secret: false
      - name: kubeconfig
        type: string
        required: false
        secret: false
      - name: cluster
        type: any
        required: false
        secret: false
  - key: k8s-namespace
    inputs: []
    outputs:
      - name: name
        type: string
        required: true
        secret: false
  - key: postgres
    inputs:
      - name: database
        type: string
        required: true
      - name: username
        type: string
        required: true
    outputs:
      - name: host
        type: string
        required: true
        secret: false
      - name: port
        type: number
        required: true
        secret: false
      - name: database
        type: string
        required: true
        secret: false
      - name: username
        type: string
        required: true
        secret: false
      - name: password
        type: string
        required: true
        secret: true
      - name: uri
        type: string
        required: false
        secret: true
      - name: jdbcUrl
        type: string
        required: false
        secret: false
  - key: redis
    inputs: []
    outputs:
      - name: host
        type: string
        required: true
        secret: false
      - name: port
        type: number
        required: true
        secret: false
      - name: username
        type: string
        required: true
        secret: false
      - name: password
        type: string
        required: true
        secret: true
      - name: tls
        type: bool
        required: true
        secret: false
      - name: uri
        type: string
        required: false
        secret: true
  - key: workload
    inputs: []
    outputs: []
  - key: mysql
    inputs:
      - name: image
        type: string
        required: true
      - name: database
        type: string
        required: true
      - name: username
        type: string
        required: true
      - name: storage
        type: string
        required: false
    outputs:
      - name: host
        type: string
        required: true
        secret: false
      - name: port
        type: number
        required: true
        secret: false
      - name: database
        type: string
        required: true
        secret: false
      - name: username
        type: string
        required: true
        secret: false
      - name: claimName
        type: string
        required: true
        secret: false
      - name: namespace
        type: string
        required: true
        secret: false
      - name: password
        type: string
        required: true
        secret: true
      - name: uri
        type: string
        required: false
        secret: true
      - name: jdbcUrl
        type: string
        required: false
        secret: false
  - key: endpoint
    inputs:
      - name: name
        type: string
        required: true
      - name: port
        type: string
        required: true
      - name: path
        type: string
        required: false
    outputs:
      - name: hostname
        type: string
        required: true
        secret: false
      - name: url
        type: string
        required: true
        secret: false
definitions:
  - key: ${seed.definitionPrefix}-cluster
    name: ${seed.definitionName} cluster
    resourceType: k8s-cluster
    driverType: existing-cluster
    driverInputs:
      values:
        variables: {}
    provision: {}
    criteria:
      - env_type: ${seed.environmentType}
        class: ${seed.targetClass}
    driverAccount: ${seed.driverAccountKey}
  - key: ${seed.definitionPrefix}-k8s-namespace
    name: ${seed.definitionName} k8s-namespace
    resourceType: k8s-namespace
    driverType: terraform
    driverInputs:
      values:
        variables:
          name: ${context.env.namespace}
        input_mapping: {}
        output_mapping:
          name: name
        provider_bindings:
          kubernetes:
            target: resource
            resource_ref: k8s-cluster.${seed.targetClass}#environments.@app.@env
    provision: {}
    criteria:
      - env_type: ${seed.environmentType}
    modulePath: terraform/namespace
  - key: ${seed.definitionPrefix}-postgres
    name: ${seed.definitionName} postgres
    resourceType: postgres
    driverType: terraform
    driverInputs:
      values:
        variables:
          namespace: ${resources['k8s-namespace.default#environments.@app.@env'].outputs.name}
          database: acceptance
          username: app
        input_mapping:
          database:
            param: database
          username:
            param: username
        output_mapping:
          database: database
          host: host
          password: password
          port: port
          username: username
          uri: uri
          jdbcUrl: jdbcUrl
        provider_bindings:
          kubernetes:
            target: resource
            resource_ref: k8s-cluster.${seed.targetClass}#environments.@app.@env
    provision: {}
    criteria:
      - env_type: ${seed.environmentType}
        class: ${seed.resourceClass}
    modulePath: terraform/postgres
  - key: ${seed.definitionPrefix}-redis
    name: ${seed.definitionName} redis
    resourceType: redis
    driverType: terraform
    driverInputs:
      values:
        variables:
          namespace: ${resources['k8s-namespace.default#environments.@app.@env'].outputs.name}
        input_mapping: {}
        output_mapping:
          host: host
          password: password
          port: port
          tls: tls
          username: username
          uri: uri
        provider_bindings:
          kubernetes:
            target: resource
            resource_ref: k8s-cluster.${seed.targetClass}#environments.@app.@env
    provision: {}
    criteria:
      - env_type: ${seed.environmentType}
        class: ${seed.resourceClass}
    modulePath: terraform/redis
  - key: ${seed.definitionPrefix}-mysql
    name: ${seed.definitionName} mysql
    resourceType: mysql
    driverType: terraform
    modulePath: terraform/mysql
    driverInputs:
      values:
        variables:
          namespace: ${resources['k8s-namespace.default#environments.@app.@env'].outputs.name}
          database: app
          username: app
        input_mapping:
          image:
            param: image
          database:
            param: database
          username:
            param: username
          storage:
            param: storage
        output_mapping:
          host: host
          port: port
          database: database
          username: username
          claimName: claimName
          namespace: namespace
          password: password
          uri: uri
          jdbcUrl: jdbcUrl
        provider_bindings:
          kubernetes:
            target: resource
            resource_ref: k8s-cluster.${seed.targetClass}#environments.@app.@env
    provision: {}
    criteria:
      - env_type: ${seed.environmentType}
        class: ${seed.resourceClass}
  - key: ${seed.definitionPrefix}-storage
    name: ${seed.definitionName} storage
    resourceType: persistent-storage
    driverType: terraform
    modulePath: terraform/persistent-storage
    driverInputs:
      values:
        variables:
          namespace: ${resources['k8s-namespace.default#environments.@app.@env'].outputs.name}
          storage: 1Gi
        input_mapping:
          storage:
            param: storage
        output_mapping:
          claimName: claimName
          namespace: namespace
        provider_bindings:
          kubernetes:
            target: resource
            resource_ref: k8s-cluster.${seed.targetClass}#environments.@app.@env
    provision: {}
    criteria:
      - env_type: ${seed.environmentType}
  - key: ${seed.definitionPrefix}-workload
    name: ${seed.definitionName} workload
    resourceType: workload
    driverType: template
    driverInputs:
      values:
        variables:
          template_inputs: {}
          namespace: ${resources['k8s-namespace.default#environments.@app.@env'].outputs.name}
    provision: {}
    criteria:
      - env_type: ${seed.environmentType}
        class: ${seed.targetClass}
    templatePath: templates/standard
  - key: ${seed.definitionPrefix}-endpoint
    name: ${seed.definitionName} public endpoint
    resourceType: endpoint
    driverType: endpoint
    driverInputs:
      values:
        variables:
          rootDomain: ${seed.endpointRootDomain}
          scheme: ${seed.endpointScheme}
          gatewayName: ${seed.gatewayName}
          gatewayNamespace: ${seed.gatewayNamespace}
          gatewaySectionName: ${seed.gatewaySectionName}
    provision: {}
    criteria:
      - env_type: ${seed.environmentType}
