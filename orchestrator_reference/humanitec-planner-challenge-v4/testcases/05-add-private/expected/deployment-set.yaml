modules:
  api:
    profile: humanitec/default-module
    spec:
      containers:
        main:
          id: main
          image: ghcr.io/acme/api:v1
          variables:
            DB_HOST: ${externals.db.host}
    externals:
      db:
        type: postgres
        class: default
        params:
          size: large
          region: eu-west-1
