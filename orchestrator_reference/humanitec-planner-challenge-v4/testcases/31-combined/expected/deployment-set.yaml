modules:
  api:
    profile: humanitec/default-module
    spec:
      containers:
        main:
          id: main
          image: ghcr.io/acme/api:v3
          variables:
            DB: ${externals.db.host}
            CACHE: ${shared.team-cache.host}
        metrics:
          id: metrics
          image: ghcr.io/acme/metrics:v1
          variables:
            PORT: '9090'
    externals:
      db:
        type: postgres
        class: default
        params:
          size: large
          region: eu-west-1
shared:
  team-cache:
    type: redis
    class: default
    params:
      memory: 2
