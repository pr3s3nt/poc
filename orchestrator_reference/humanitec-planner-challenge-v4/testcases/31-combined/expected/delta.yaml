modules:
  update:
    api:
    - op: add
      path: /externals
      value:
        db:
          type: postgres
          class: default
          params:
            size: large
            region: eu-west-1
    - op: replace
      path: /spec/containers/main/image
      value: ghcr.io/acme/api:v3
    - op: add
      path: /spec/containers/main/variables
      value:
        DB: ${externals.db.host}
        CACHE: ${shared.team-cache.host}
    - op: add
      path: /spec/containers/metrics
      value:
        id: metrics
        image: ghcr.io/acme/metrics:v1
        variables:
          PORT: '9090'
shared:
- op: add
  path: /team-cache
  value:
    type: redis
    class: default
    params:
      memory: 2
