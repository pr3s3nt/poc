apiVersion: orchestrator.dev/template-source/v1
kind: TemplateSource
metadata:
  name: standard-workload
renderer:
  type: template
  version: 1.0.0
inputContract: orchestrator.dev/template-input/v1
inputsSchema: inputs.schema.json
defaults: defaults.yaml
normalize: normalize/workload.tpl
workloadCapabilities:
  - template-defaults-v1
  - runtime-security-v1
  - controller-policy-v1
  - stateful-claims-v1
  - custom-execution-v1
  - container-lifecycle-v1
  - pod-volumes-v1
  - host-path-volumes-v1
  - container-probes-v1
resources:
  - resources/pdb.tpl
  - resources/configmaps.tpl
  - resources/deployment.tpl
  - resources/service.tpl
  - resources/identity.tpl
patches:
  - patches/deployment.tpl
  - patches/service.tpl
  - patches/execution.tpl
  - patches/container-lifecycle.tpl
  - patches/runtime-policy.tpl
workloadTemplates:
  - id: frontend
    version: 1.2.0
    kind: Deployment
    labels:
      vi: Frontend web
      en: Frontend web
    inputsSchema:
      type: object
      additionalProperties: false
      properties: {}
    defaults: {}
    runtimeDefaults:
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 512Mi}
      containerSecurityContext:
        privileged: false
      auxiliaryContainerSecurityContext:
        privileged: false
      probeTimings:
        readinessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        livenessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        startupProbe: {periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 30, successThreshold: 1, initialDelaySeconds: 0}
      replicas: 1
      execution:
        revisionHistoryLimit: 3
        updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
        persistentUpdateStrategy: {type: Recreate}
        podDisruptionBudget: {enabled: true, maxUnavailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow}
      environments:
        production:
          resources:
            requests: {cpu: 200m, memory: 256Mi}
          execution: {revisionHistoryLimit: 10}
  - id: backend
    version: 1.2.0
    kind: Deployment
    labels:
      vi: Backend API
      en: Backend API
    inputsSchema:
      type: object
      additionalProperties: false
      properties: {}
    defaults: {}
    runtimeDefaults:
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 512Mi}
      containerSecurityContext:
        privileged: false
      auxiliaryContainerSecurityContext:
        privileged: false
      probeTimings:
        readinessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        livenessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        startupProbe: {periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 30, successThreshold: 1, initialDelaySeconds: 0}
      replicas: 1
      execution:
        revisionHistoryLimit: 3
        updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
        persistentUpdateStrategy: {type: Recreate}
        podDisruptionBudget: {enabled: true, maxUnavailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow}
      environments:
        production:
          resources:
            requests: {cpu: 200m, memory: 256Mi}
          execution: {revisionHistoryLimit: 10}
  - id: worker
    version: 1.2.0
    kind: Deployment
    labels:
      vi: Xử lý nền
      en: Background worker
    inputsSchema:
      type: object
      additionalProperties: false
      properties: {}
    defaults: {}
    runtimeDefaults:
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 512Mi}
      containerSecurityContext:
        privileged: false
      auxiliaryContainerSecurityContext:
        privileged: false
      probeTimings:
        readinessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        livenessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        startupProbe: {periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 30, successThreshold: 1, initialDelaySeconds: 0}
      replicas: 1
      execution:
        revisionHistoryLimit: 3
        updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
        persistentUpdateStrategy: {type: Recreate}
        podDisruptionBudget: {enabled: true, maxUnavailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow}
      environments:
        production:
          resources:
            requests: {cpu: 200m, memory: 256Mi}
          execution: {revisionHistoryLimit: 10}
  - id: stateful
    version: 1.2.0
    kind: StatefulSet
    labels:
      vi: Ứng dụng có dữ liệu
      en: Stateful application
    inputsSchema:
      type: object
      additionalProperties: false
      properties: {}
    defaults: {}
    runtimeDefaults:
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 512Mi}
      containerSecurityContext:
        privileged: false
      auxiliaryContainerSecurityContext:
        privileged: false
      probeTimings:
        readinessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        livenessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        startupProbe: {periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 30, successThreshold: 1, initialDelaySeconds: 0}
      replicas: 1
      execution:
        revisionHistoryLimit: 3
        updateStrategy: {type: RollingUpdate, rollingUpdate: {partition: 0}}
        persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
      environments:
        production:
          resources:
            requests: {cpu: 200m, memory: 256Mi}
          execution: {revisionHistoryLimit: 10}
  - id: scheduled
    version: 1.2.0
    kind: CronJob
    labels:
      vi: Tác vụ theo lịch
      en: Scheduled job
    inputsSchema:
      type: object
      additionalProperties: false
      properties: {}
    defaults: {}
    runtimeDefaults:
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 512Mi}
      containerSecurityContext:
        privileged: false
      auxiliaryContainerSecurityContext:
        privileged: false
      probeTimings:
        readinessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        livenessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        startupProbe: {periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 30, successThreshold: 1, initialDelaySeconds: 0}
      execution:
        schedule:
          timeZone: Asia/Bangkok
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 3
      environments:
        production:
          resources:
            requests: {cpu: 200m, memory: 256Mi}
  - id: nginx-readonly
    version: 1.1.0
    kind: Deployment
    labels:
      vi: Nginx chỉ đọc
      en: Read-only Nginx
    descriptions:
      vi: Nginx non-root, cổng 8080, cache và tmp tách riêng.
      en: Non-root Nginx on port 8080 with separate cache and tmp volumes.
    inputsSchema:
      type: object
      additionalProperties: false
      properties: {}
    defaults: {}
    runtimeDefaults:
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 512Mi}
      containerSecurityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      auxiliaryContainerSecurityContext:
        privileged: false
        allowPrivilegeEscalation: false
      probeTimings:
        readinessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        livenessProbe: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3, successThreshold: 1}
        startupProbe: {periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 30, successThreshold: 1, initialDelaySeconds: 0}
      replicas: 1
      multiReplicaSafe: true
      execution:
        automountServiceAccountToken: false
        podSecurityContext:
          seccompProfile: {type: RuntimeDefault}
        revisionHistoryLimit: 3
        updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
        persistentUpdateStrategy: {type: Recreate}
        podDisruptionBudget: {enabled: true, maxUnavailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow}
      environments:
        production:
          resources:
            requests: {cpu: 200m, memory: 256Mi}
          execution: {revisionHistoryLimit: 10}
          replicas: 2
      image: nginxinc/nginx-unprivileged:1.27-alpine
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        path: /
        port: 8080
      service:
        ports:
          http:
            port: 80
            targetPort: 8080
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 256Mi
      volumeMounts:
        - volume: nginx-cache
          container: main
          path: /var/cache/nginx
          readOnly: false
        - volume: nginx-tmp
          container: main
          path: /tmp
          readOnly: false
