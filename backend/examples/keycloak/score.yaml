apiVersion: score.dev/v1b1
metadata:
  name: keycloak
containers:
  main:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    args: [start-dev, --cache=local]
    variables:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${resources.env.KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: ${resources.db.host}
      KC_DB_URL_PORT: ${resources.db.port}
      KC_DB_URL_DATABASE: ${resources.db.database}
      KC_DB_USERNAME: ${resources.db.username}
      KC_DB_PASSWORD: ${resources.db.password}
      KC_HTTP_PORT: "8080"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
    readinessProbe:
      httpGet:
        path: /realms/master/.well-known/openid-configuration
        port: 8080
service:
  ports:
    http:
      port: 8080
      targetPort: 8080
resources:
  env:
    type: environment
  db:
    type: postgres
    params:
      database: keycloak
      username: keycloak
