name: orchestrator-local

services:
  # Option A (ADR-014) fresh provisioning: generates, once, the owner, Console
  # and State login passwords/URLs and the independent Terraform state key
  # into separate owner-only volumes. Nothing is printed.
  db-credentials:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    user: "0:0"
    entrypoint: ["/bin/sh", "/local/init-db-credentials.sh"]
    volumes:
      - ./deploy/local/init-db-credentials.sh:/local/init-db-credentials.sh:ro
      - db-role-passwords:/role-passwords
      - db-owner-credential:/owner
      - db-runtime-credentials:/runtime
      - terraform-state-key:/state-key
      # Read-only: generation is refused unless the database is fresh too.
      - postgres-data:/pgdata:ro
    restart: "no"
    networks: [orchestrator-net]

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when postgres-data is initialized for the first time.
      - ./deploy/local/postgres-init-roles.sh:/docker-entrypoint-initdb.d/10-orchestrator-roles.sh:ro
      - db-role-passwords:/run/orchestrator/role-passwords:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      db-credentials:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [orchestrator-net]

  # Explicit owner step: creates the baseline in the fresh empty database and
  # grants the Console and State logins; on an initialized database it only
  # verifies. Only this service sees the owner credential.
  db-setup:
    image: ${BACKEND_IMAGE:-orchestrator-backend:local}
    pull_policy: build
    build:
      context: ./backend
    entrypoint: ["/usr/local/bin/orchestrator", "-setup-database",
      "-database-owner-url-file", "/run/orchestrator/owner/database-url",
      "-console-database-role", "orchestrator_console",
      "-state-database-role", "orchestrator_state"]
    volumes:
      - db-owner-credential:/run/orchestrator/owner:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [orchestrator-net]

  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.21}
    user: "0:0"
    entrypoint: ["/bin/sh", "/local/start-vault.sh"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./deploy/local/vault.hcl:/local/vault.hcl:ro
      - ./deploy/local/start-vault.sh:/local/start-vault.sh:ro
      - ./deploy/local/connections-policy.hcl:/local/connections-policy.hcl:ro
      - ./deploy/local/applications-policy.hcl:/local/applications-policy.hcl:ro
      - vault-data:/vault/data
      - vault-bootstrap:/vault/bootstrap
      - connection-token:/connection-token
      - app-token:/app-token
      - output-token:/output-token
      - ./deploy/local/outputs-policy.hcl:/local/outputs-policy.hcl:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/vault-ready && vault status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [orchestrator-net]

  backend:
    image: ${BACKEND_IMAGE:-orchestrator-backend:local}
    pull_policy: build
    build:
      context: ./backend
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080"]
    environment:
      ORCHESTRATOR_LISTEN_ADDR: 0.0.0.0:8080
      ORCHESTRATOR_ADAPTERS: kubernetes
      # Least-privilege runtime logins (never the owner or superuser) and the
      # independent state key, each from its own owner-only file.
      ORCHESTRATOR_DATABASE_URL_FILE: /run/orchestrator/runtime/console-database-url
      ORCHESTRATOR_TERRAFORM_STATE_DATABASE_URL_FILE: /run/orchestrator/runtime/state-database-url
      ORCHESTRATOR_TERRAFORM_STATE_KEY_FILE: /run/orchestrator/state-key/key
      ORCHESTRATOR_TERRAFORM_STATE_KEY_ID: ${TERRAFORM_STATE_KEY_ID:-local-state-key-1}
      ORCHESTRATOR_CONNECTION_CREDENTIAL_STORE: vault
      ORCHESTRATOR_CONNECTION_VAULT_ADDR: http://vault:8200
      ORCHESTRATOR_CONNECTION_VAULT_TOKEN_FILE: /run/connection-token/token
      # Explicit opt-in: seed the bundled Vault as the ordinary verified store
      # platform-vault. The token file is bootstrap input only; runtime resolves
      # the store's credential reference from the Connection credential store.
      # The workload address is what Pods use, not necessarily the Compose name.
      ORCHESTRATOR_PLATFORM_VAULT_BOOTSTRAP: "true"
      ORCHESTRATOR_PLATFORM_VAULT_ADDR: http://vault:8200
      ORCHESTRATOR_PLATFORM_VAULT_WORKLOAD_ADDR: ${VAULT_WORKLOAD_ADDRESS:-http://vault:8200}
      ORCHESTRATOR_PLATFORM_VAULT_TOKEN_FILE: /run/app-token/token
      ORCHESTRATOR_OUTPUT_SECRET_STORE: vault
      ORCHESTRATOR_OUTPUT_SECRET_VAULT_ADDR: http://vault:8200
      ORCHESTRATOR_OUTPUT_SECRET_VAULT_TOKEN_FILE: /run/output-token/token
      ORCHESTRATOR_TERRAFORM_RECOVERY_DIR: /var/lib/orchestrator/recovery
    volumes:
      - connection-token:/run/connection-token:ro
      - app-token:/run/app-token:ro
      - output-token:/run/output-token:ro
      - terraform-recovery:/var/lib/orchestrator/recovery
      - db-runtime-credentials:/run/orchestrator/runtime:ro
      - terraform-state-key:/run/orchestrator/state-key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      db-setup:
        condition: service_completed_successfully
      vault:
        condition: service_healthy
    restart: unless-stopped
    networks: [orchestrator-net]

  frontend:
    image: ${FRONTEND_IMAGE:-orchestrator-frontend:local}
    pull_policy: build
    build:
      context: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-3001}:8080"]
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [orchestrator-net]

networks:
  orchestrator-net:
    driver: bridge

volumes:
  postgres-data:
  db-role-passwords:
  db-owner-credential:
  db-runtime-credentials:
  terraform-state-key:
  vault-data:
  vault-bootstrap:
  connection-token:
  app-token:
  output-token:
  terraform-recovery:
