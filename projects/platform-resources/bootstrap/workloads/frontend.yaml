apiVersion: orchestrator.dev/workload/v1
containers:
  main:
    image: "@@FRONTEND_IMAGE@@"
    livenessProbe:
      path: /healthz
      port: 8080
    readinessProbe:
      path: /healthz
      port: 8080
    variables:
      BACKEND_URL: ${resources.svc_backend_http.url}
      PORT: ${resources.env.PORT}
metadata:
  name: frontend
  class: ${bootstrap.targetClass}
resources:
  public_http:
    type: httproute
    class: in-cluster
    id: acceptance-frontend-http
    params:
      hostname: ${bootstrap.httprouteHostname}
      service: frontend
      port: 8080
      path: ${bootstrap.httproutePath}
  svc_backend_http:
    params:
      port: http
      workload: backend
    type: service
  env:
    type: environment
service:
  ports:
    http:
      port: 8080
      targetPort: 8080
