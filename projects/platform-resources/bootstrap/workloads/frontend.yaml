apiVersion: orchestrator.dev/workload/v1
containers:
  main:
    image: "@@FRONTEND_IMAGE@@"
    livenessProbe:
      path: /healthz
      port: 8080
    readinessProbe:
      path: /healthz
      port: 8080
    variables:
      BACKEND_URL: ${resources.svc_backend_http.url}
      PORT: ${resources.env.PORT}
metadata:
  annotations:
    routing.orchestrator.dev/hostname: ${bootstrap.httprouteHostname}
    routing.orchestrator.dev/path: ${bootstrap.httproutePath}
    routing.orchestrator.dev/service-port: ${bootstrap.httprouteServicePort}
  name: frontend
  class: ${bootstrap.targetClass}
resources:
  svc_backend_http:
    params:
      port: http
      workload: backend
    type: service
  env:
    type: environment
service:
  ports:
    http:
      port: 8080
      targetPort: 8080
