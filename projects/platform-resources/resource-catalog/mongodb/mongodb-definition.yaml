# Nhập sau mongodb-type.yaml: Console > Cấu hình tài nguyên > Nhập YAML/JSON.
# Hướng dẫn: resource-catalog/mongodb/README.md trong repo phát hành.
# Thay TẤT CẢ giá trị <...> trước khi nhập; đây chưa phải source pin đã xác minh.
# Inspect module MongoDB từ Git trên Console đích rồi chép đủ năm trường source
# từ CÙNG kết quả inspect. Module tham chiếu trong repo này:
# terraform/mongodb trong repo orchestrator-workload-templates.
# subdirectory phải theo kết quả inspect thực tế.
# Module phải nhận image/database/username/storage/namespace và xuất đủ sáu
# output được map bên dưới; password/master_password do executor cung cấp.
# Không thêm password hoặc master_password vào variables/input_mapping.
key: staging-mongodb
name: Staging MongoDB
resourceType: mongodb
driverType: terraform
driverInputs:
  values:
    source:
      source_id: "<sourceId đã đăng ký trên Console đích>"
      module_id: "<moduleId MongoDB đã inspect>"
      revision: "<revision bất biến đã inspect>"
      subdirectory: "<subdirectory chính xác đã inspect>"
      content_sha256: "<contentSha256 đầy đủ 64 ký tự hex đã inspect>"
    variables:
      # Docker Official Image MongoDB hoặc image nội bộ tương thích có mongosh.
      # Dùng digest thật đã duyệt, dạng registry/repository@sha256:64-hex.
      image: "<image MongoDB đã pin bằng digest>"
      namespace: "${resources['k8s-namespace.default#environments.@app.@env'].outputs.name}"
      username: app
      storage: 10Gi
      # Rỗng: dùng StorageClass mặc định của cluster; sửa nếu cần class cụ thể.
      storage_class: ""
      # Rỗng: không dùng imagePullSecret; nếu cần, điền tên Secret đã có ở namespace.
      image_pull_secret_name: ""
      root_username: admin
    # Tên module variable -> input của Type. Workload param ghi đè fallback.
    input_mapping:
      database: {param: database}
      username: {param: username}
      storage: {param: storage}
    # Tên module output -> output của Type. Không công bố claimName/namespace.
    output_mapping:
      host: host
      port: port
      database: database
      username: username
      password: password
      connection: connection
    provider_bindings:
      kubernetes:
        target: resource
        # Thay bootstrap-dev bằng class cluster thực tế nếu khác.
        resource_ref: "k8s-cluster.bootstrap-dev#environments.@app.@env"
# staging/in-cluster là lựa chọn của mẫu; sửa theo môi trường cần sử dụng.
# Cần Definition cluster class bootstrap-dev và namespace class default match
# được cùng ngữ cảnh. Giữ nguyên @app/@env để platform resolve dependencies.
criteria:
  - env_type: staging
    class: in-cluster
provision: {}
