# Owner step for one image tag. Job specs are immutable, so the tag is in its name.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-setup-IMAGE_TAG
  namespace: orchestrator-dev-3070
  labels:
    app.kubernetes.io/part-of: orchestrator-dev-3070
    app.kubernetes.io/managed-by: poc-local-installer
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: orchestrator-dev-3070
        app.kubernetes.io/managed-by: poc-local-installer
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: setup
        image: orchestrator-backend:IMAGE_TAG
        imagePullPolicy: Never
        command:
        - /usr/local/bin/orchestrator
        - -setup-database
        - -database-owner-url-file
        - /run/owner/database-url
        - -console-database-role
        - orchestrator_console
        - -state-database-role
        - orchestrator_state
        volumeMounts:
        - name: storage
          mountPath: /run/owner
          subPath: owner
          readOnly: true
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: platform-storage
