apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: orchestrator-dev-3070
  labels:
    app.kubernetes.io/part-of: orchestrator-dev-3070
    app.kubernetes.io/managed-by: poc-local-installer
spec:
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: orchestrator-dev-3070
  labels:
    app.kubernetes.io/part-of: orchestrator-dev-3070
    app.kubernetes.io/managed-by: poc-local-installer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: orchestrator-dev-3070
        app.kubernetes.io/managed-by: poc-local-installer
    spec:
      automountServiceAccountToken: false
      containers:
      - name: frontend
        image: orchestrator-frontend:IMAGE_TAG
        imagePullPolicy: Never
        env:
        - name: BACKEND_URL
          value: http://backend:8080
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - wget -q -O /dev/null http://127.0.0.1:8080/healthz
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 24
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
