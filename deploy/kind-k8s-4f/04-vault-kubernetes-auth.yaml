# Token reviewer for the Console Vault's Kubernetes auth mount (workload secrets
# through VSO). The Vault Pod does not mount a ServiceAccount token, so Vault
# reviews workload JWTs with this dedicated identity. See README, "Vault
# Kubernetes auth". The token Secret is generated by Kubernetes; never commit it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-token-reviewer
  namespace: orchestrator-dev-3070
  labels:
    app.kubernetes.io/part-of: orchestrator-dev-3070
    app.kubernetes.io/managed-by: poc-local-installer
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-token-reviewer
  namespace: orchestrator-dev-3070
  labels:
    app.kubernetes.io/part-of: orchestrator-dev-3070
    app.kubernetes.io/managed-by: poc-local-installer
  annotations:
    kubernetes.io/service-account.name: vault-token-reviewer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestrator-dev-3070-vault-token-reviewer
  labels:
    app.kubernetes.io/part-of: orchestrator-dev-3070
    app.kubernetes.io/managed-by: poc-local-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-token-reviewer
    namespace: orchestrator-dev-3070
