apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  selector:
    app: vault
  ports:
  - port: 8200
    targetPort: 8200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      automountServiceAccountToken: false
      containers:
      - name: vault
        image: hashicorp/vault:1.21
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8200
          name: vault
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        command:
        - sh
        - /config/start-vault.sh
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /vault/data
          readOnly: false
        - name: config
          mountPath: /config
          readOnly: true
        - name: tokens
          mountPath: /tokens
          readOnly: true
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - test -f /tmp/vault-ready && VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null
          periodSeconds: 5
          timeoutSeconds: 3
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - test -f /tmp/vault-ready && VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - kill -0 1
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vault-data
      - name: config
        configMap:
          name: orchestrator-bootstrap
      - name: tokens
        secret:
          secretName: vault-tokens
          defaultMode: 256
