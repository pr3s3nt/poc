apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orchestrator
spec:
  parentRefs:
  - name: REPLACE_GATEWAY_NAME
    namespace: REPLACE_GATEWAY_NAMESPACE
    sectionName: websecure
  hostnames:
  - poc.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 8080
