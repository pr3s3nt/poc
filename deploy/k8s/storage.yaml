apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: terraform-recovery
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
