# Strategic merge PATCH for the existing staging Deployment, not a full
# Deployment manifest. See README.md; apply only in the staging-owned context.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: orchestrator
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: ORCHESTRATOR_TERRAFORM_CLI_CONFIG_FILE
              value: /etc/orchestrator/terraform-offline.tfrc
# Providers and policy ship in the image. No volume may shadow
# /usr/local/share/orchestrator/provider-mirror or /etc/orchestrator.
