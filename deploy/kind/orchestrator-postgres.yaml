apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: orchestrator-system
  labels:
    app.kubernetes.io/name: orchestrator-postgres
spec:
  selector:
    app.kubernetes.io/name: orchestrator-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: orchestrator-system
  labels:
    app.kubernetes.io/name: orchestrator-postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: orchestrator
            - name: POSTGRES_USER
              value: orchestrator
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U orchestrator -d orchestrator"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: orchestrator-postgres
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
