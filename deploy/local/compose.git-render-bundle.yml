# Run-owned Console for the Git render bundle acceptance (ADR-021). Used only by
# backend/test/integration/git-render-bundle-kind.sh with its own project name,
# prebuilt run-tagged images and loopback ports; never a retained installation.
# score-k8s is selected explicitly; the catalog starts empty.
services:
  db-setup:
    image: ${BACKEND_IMAGE:?run-tagged backend image}
    pull_policy: never
  backend:
    image: ${BACKEND_IMAGE:?run-tagged backend image}
    pull_policy: never
    command:
      - -profile
      - local
      - -seed-catalog
      - none
      - -score-k8s
      - /usr/local/bin/score-k8s
      - -terraform-root
      - /var/lib/orchestrator/tfroot
    environment:
      ORCHESTRATOR_TERRAFORM_MODULE_CACHE_DIR: /var/lib/orchestrator/module-cache
      TF_PLUGIN_CACHE_DIR: /var/lib/orchestrator/plugin-cache
    volumes:
      - module-cache:/var/lib/orchestrator/module-cache
      - plugin-cache:/var/lib/orchestrator/plugin-cache
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:?loopback port}:8080"
  frontend:
    image: ${FRONTEND_IMAGE:?run-tagged frontend image}
    pull_policy: never
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:?loopback port}:8080"
volumes:
  module-cache:
  plugin-cache:
