# Disposable reconciliation acceptance overlay. The caller supplies a unique
# Compose project, private loopback ports and run-tagged images built from source.
services:
  db-setup:
    image: ${BACKEND_IMAGE:?run-tagged backend image}
    pull_policy: never
  backend:
    image: ${BACKEND_IMAGE:?run-tagged backend image}
    pull_policy: never
    command:
      - -profile
      - local
      - -seed-catalog
      - staging
      - -score-k8s
      - /usr/local/bin/score-k8s
      - -terraform-root
      - /var/lib/orchestrator/tfroot
    environment:
      ORCHESTRATOR_DELIVERY_GIT_ROOT: /var/lib/orchestrator/delivery-git
      ORCHESTRATOR_INFRASTRUCTURE_DRIFT: ${INFRASTRUCTURE_DRIFT:-false}
      ORCHESTRATOR_TERRAFORM_MODULE_CACHE_DIR: /var/lib/orchestrator/module-cache
      TF_PLUGIN_CACHE_DIR: /var/lib/orchestrator/plugin-cache
    volumes:
      - delivery-git:/var/lib/orchestrator/delivery-git
      - module-cache:/var/lib/orchestrator/module-cache
      - plugin-cache:/var/lib/orchestrator/plugin-cache
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:?loopback port}:8080"
  frontend:
    image: ${FRONTEND_IMAGE:?run-tagged frontend image}
    pull_policy: never
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:?loopback port}:8080"
volumes:
  delivery-git:
  module-cache:
  plugin-cache:
