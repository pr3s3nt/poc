# Apply after docker-compose.yml and compose.feature-url.yml, FEATURE=keycloak.
services:
  keycloak-inputs:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /input/oidc.json /backend-input/oidc.json
        chown 65532:65532 /backend-input/oidc.json
        chmod 600 /backend-input/oidc.json
        cp /input/realm.json /realm-input/realm.json
        cp /input/keycloak-admin-password /realm-input/admin-password
        chown -R 1000:1000 /realm-input /keycloak-data
        chmod 600 /realm-input/*
    volumes:
      - ${KEYCLOAK_PRIVATE_DIR:?}:/input:ro
      - oidc-config:/backend-input
      - keycloak-realm:/realm-input
      - keycloak-data:/keycloak-data
    restart: "no"
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /opt/keycloak/data/import/admin-password)"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: test-admin
      KC_HOSTNAME: http://sso-keycloak.${FEATURE_DOMAIN:?}:8088
      KC_HTTP_PORT: "8088"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak-realm:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    depends_on:
      keycloak-inputs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088"]
      interval: 5s
      retries: 60
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak-sso.rule=Host(`sso-keycloak.${FEATURE_DOMAIN:?}`)
      - traefik.http.routers.keycloak-sso.entrypoints=web
      - traefik.http.services.keycloak-sso.loadbalancer.server.port=8088
    networks:
      orchestrator-net:
        aliases:
          - sso-keycloak.${FEATURE_DOMAIN:?}
      feature-proxy:
    restart: unless-stopped
  backend:
    command: ["-profile", "production"]
    environment:
      ORCHESTRATOR_OIDC_CONFIG_FILE: /run/orchestrator/oidc/oidc.json
    volumes:
      - oidc-config:/run/orchestrator/oidc:ro
    depends_on:
      keycloak:
        condition: service_healthy
volumes:
  oidc-config:
  keycloak-realm:
  keycloak-data:
