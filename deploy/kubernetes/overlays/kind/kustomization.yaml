apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orchestrator-manifest-trial
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/managed-by: orchestrator-installer
      app.kubernetes.io/part-of: orchestrator
      orchestrator.dev/environment: kind
configMapGenerator:
  - name: installation-settings
    literals:
      - CONTEXT=kind-k8s-4f
      - HOSTNAME=CHANGE_ME_HOSTNAME
      - GATEWAY=httproute-domain-gateway
      - GATEWAY_NAMESPACE=httproute-domain-test
      - LISTENER=web
      - SCHEME=http
      - STORAGE_CLASS=standard
    options:
      disableNameSuffixHash: true
      labels:
        orchestrator.dev/phase: config
replacements:
  - source:
      kind: ConfigMap
      name: installation-settings
      fieldPath: data.HOSTNAME
    targets:
      - select:
          kind: HTTPRoute
          name: console
        fieldPaths:
          - spec.hostnames.0
  - source:
      kind: ConfigMap
      name: installation-settings
      fieldPath: data.GATEWAY
    targets:
      - select:
          kind: HTTPRoute
          name: console
        fieldPaths:
          - spec.parentRefs.0.name
  - source:
      kind: ConfigMap
      name: installation-settings
      fieldPath: data.GATEWAY_NAMESPACE
    targets:
      - select:
          kind: HTTPRoute
          name: console
        fieldPaths:
          - spec.parentRefs.0.namespace
  - source:
      kind: ConfigMap
      name: installation-settings
      fieldPath: data.LISTENER
    targets:
      - select:
          kind: HTTPRoute
          name: console
        fieldPaths:
          - spec.parentRefs.0.sectionName
  - source:
      kind: ConfigMap
      name: installation-settings
      fieldPath: data.STORAGE_CLASS
    targets:
      - select:
          kind: PersistentVolumeClaim
        fieldPaths:
          - spec.storageClassName
        options:
          create: true
