apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  labels:
    orchestrator.dev/phase: application
spec:
  parentRefs:
    - name: GATEWAY
      namespace: GATEWAY_NAMESPACE
      sectionName: LISTENER
  hostnames:
    - HOSTNAME
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
