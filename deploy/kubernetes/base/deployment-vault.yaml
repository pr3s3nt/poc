apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    orchestrator.dev/phase: dependencies
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 100
      initContainers:
        - name: private-files
          image: hashicorp/vault:1.21
          command:
            - sh
            - /scripts/prepare-private.sh
          env:
            - name: PRIVATE_UID
              value: "100"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: private
              mountPath: /private
            - name: scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: vault
          image: hashicorp/vault:1.21
          command:
            - vault
            - server
            - -config=/config/vault.hcl
          securityContext:
            runAsUser: 100
            runAsGroup: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: VAULT_ADDR
              value: https://127.0.0.1:8200
            - name: VAULT_CACERT
              value: /private/vault-ca.crt
          volumeMounts:
            - name: data
              mountPath: /vault/data
            - name: private
              mountPath: /private
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - vault status >/dev/null 2>&1
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vault-data
        - name: private
          emptyDir: {}
        - name: config
          configMap:
            name: vault-config
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: installation-scripts
            defaultMode: 292
        - name: source
          projected:
            defaultMode: 256
            sources:
              - secret:
                  name: vault-tls
                  items:
                    - key: tls.crt
                      path: server.crt
                    - key: tls.key
                      path: server.key
              - secret:
                  name: orchestrator-trust
                  items:
                    - key: vault-ca.crt
                      path: vault-ca.crt
