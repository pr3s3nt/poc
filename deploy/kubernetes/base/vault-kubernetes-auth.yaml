apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-vault-reviewer
  labels:
    orchestrator.dev/phase: vault-reviewer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestrator-vault-reviewer
  labels:
    orchestrator.dev/phase: vault-reviewer
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestrator-vault-reviewer
  labels:
    orchestrator.dev/phase: vault-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orchestrator-vault-reviewer
subjects:
  - kind: ServiceAccount
    name: orchestrator-vault-reviewer
