apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    orchestrator.dev/phase: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: orchestrator-frontend:RELEASE
          env:
            - name: BACKEND_URL
              value: http://backend:8080
          readinessProbe:
            httpGet:
              port: 8080
              path: /healthz
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes: []
